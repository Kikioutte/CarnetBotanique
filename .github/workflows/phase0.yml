name: Phase 0 — Baseline qualité

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Construire les assets de production
        run: npm run build:assets

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Tests bout-en-bout existants (73 tests)
        run: npm test

      - name: Tests de mise à jour PWA (service worker)
        run: npm run test:pwa

      # La Phase 3 transforme la baseline en contrat bloquant : clavier,
      # fenêtres, axe-core, responsive et budgets doivent tous rester verts.
      - name: Phase 3 — accessibilité WCAG (strict)
        run: npm run test:phase3

      # Contrat strict ajouté en Phase 2 : les sept largeurs doivent conserver
      # une navigation complète, visible, utilisable et sans débordement.
      - name: Phase 2 — navigation responsive (strict)
        run: npm run test:phase2

      # STRICT et bloquant depuis le correctif PWA : échoue si la VERSION du SW
      # est en retard sur les extensions, ou si un fichier du shell a changé
      # sans mise à jour de SHELL_HASH dans sw.js (sinon les visiteurs déjà
      # équipés ne recevraient jamais la mise à jour).
      - name: Service worker — version et empreinte du shell (strict)
        run: npm run test:sw-version:strict

      # Phase 4 : mesure sur un serveur statique compressé, comme en production.
      # Le score mobile dépend fortement de la charge du runner : trois exécutions
      # du même commit ont été mesurées localement à 81, 97 et 97. On mesure donc
      # trois fois et on retient la médiane, sinon le portail échoue au hasard.
      - name: Lighthouse (desktop + mobile, médiane de 3 exécutions)
        run: |
          node scripts/serve-production.mjs 8892 &
          sleep 2
          npx --yes lighthouse@12 http://localhost:8892/ --preset=desktop \
            --output=json --output=html \
            --output-path=test-results/phase0/lighthouse-desktop \
            --chrome-flags="--headless=new --no-sandbox" --quiet
          for run in 1 2 3; do
            npx --yes lighthouse@12 http://localhost:8892/ \
              --output=json \
              --output-path=test-results/phase0/lighthouse-mobile-run$run.report.json \
              --chrome-flags="--headless=new --no-sandbox" --quiet
          done
          node scripts/lighthouse-median.mjs \
            test-results/phase0/lighthouse-mobile.report.json \
            test-results/phase0/lighthouse-mobile-run1.report.json \
            test-results/phase0/lighthouse-mobile-run2.report.json \
            test-results/phase0/lighthouse-mobile-run3.report.json

      - name: Phase 4 — budgets de performance Lighthouse
        run: npm run test:phase4

      # Phase 7 : chemin critique 100 % local + scores ≥ 95 partout.
      # --require-reports : en CI les rapports Lighthouse viennent d'être
      # générés ; leur absence doit faire échouer le contrôle, pas l'ignorer.
      - name: Phase 7 — performance mobile stable (chemin critique local)
        run: npm run test:phase7:ci

      # Phase 5 : la couche premium reste cohérente, accessible et frugale.
      - name: Phase 5 — contrat de finition Liquid Glass
        run: npm run test:phase5

      # Phase 6 : écrans secondaires ancrés et micro-interactions accessibles.
      - name: Phase 6 — contrat écrans secondaires
        run: npm run test:phase6

      # Phase 8 : états produit actionnables, formulaires sans perte de saisie,
      # échecs de stockage transactionnels et suppression réversible.
      - name: Phase 8 — robustesse des parcours produit
        run: npm run test:phase8

      # Phase 9 : onboarding progressif, briefing quotidien, historique typé
      # et sauvegarde explicite sans altérer les formats de données existants.
      - name: Phase 9 — maturité produit
        run: npm run test:phase9

      # Phase 10 : sortie production — peinture différée, dock mobile,
      # notifications non bloquantes et captures clair/sombre finales.
      - name: Phase 10 — préparation de la sortie
        run: npm run test:phase10

      - name: Publier les rapports et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-baseline
          path: |
            test-results/phase0/
            test-results/phase2/
            test-results/phase8/
            test-results/phase9/
            test-results/phase10/
          if-no-files-found: error
