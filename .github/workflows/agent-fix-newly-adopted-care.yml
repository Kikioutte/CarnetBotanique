name: Apply newly adopted care fix

on:
  push:
    branches:
      - fix/newly-adopted-care-overdue

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply focused fix and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'js/app.js',
              "var careState={version:2,startedAt:'',months:{},legacy:{}};",
              "var careState={version:2,startedAt:'',months:{},legacy:{},adoptedAt:{}};"
          )
          replace_once(
              'js/app.js',
              "    if(!careState.legacy) careState.legacy={};\n    if(!careState.startedAt) careState.startedAt=carePeriod(0).key;",
              "    if(!careState.legacy) careState.legacy={};\n    if(!careState.adoptedAt) careState.adoptedAt={};\n    if(!careState.startedAt) careState.startedAt=carePeriod(0).key;"
          )
          replace_once(
              'js/app.js',
              "    careState={version:2,startedAt:carePeriod(0).key,months:{},legacy:(raw&&typeof raw==='object'?raw:{})};",
              "    careState={version:2,startedAt:carePeriod(0).key,months:{},legacy:(raw&&typeof raw==='object'?raw:{}),adoptedAt:{}};"
          )
          replace_once(
              'js/app.js',
              "  if(!careState.months[prev.key]||prev.key<careState.startedAt) return [];\n  var st=carePlantState(prev.key,p.id,false);",
              "  if(!careState.months[prev.key]||prev.key<careState.startedAt) return [];\n  var adoptedAt=careState.adoptedAt&&careState.adoptedAt[p.id];\n  if(adoptedAt&&prev.key<adoptedAt) return [];\n  var st=carePlantState(prev.key,p.id,false);"
          )
          replace_once(
              'js/app.js',
              "  p.inGarden = !p.inGarden;\n  saveData();",
              "  p.inGarden = !p.inGarden;\n  loadCareState();\n  if(p.inGarden) careState.adoptedAt[p.id]=carePeriod(0).key;\n  else delete careState.adoptedAt[p.id];\n  saveCareState();\n  saveData();"
          )

          replace_once(
              'tests/e2e.mjs',
              "    careState = { version: 2, startedAt: previous.key, months: {}, legacy: {} };\n    careStateLoaded = true;\n    careState.months[previous.key] = { 'qa-care-plant': {} };\n    const overdueBefore = careOverdueTaskDefs(fake).map(t => t.key);",
              "    careState = { version: 2, startedAt: previous.key, months: {}, legacy: {}, adoptedAt: {} };\n    careStateLoaded = true;\n    careState.months[previous.key] = { 'qa-care-plant': {} };\n    careState.adoptedAt[fake.id] = current.key;\n    const newlyAdoptedOverdue = careOverdueTaskDefs(fake).map(t => t.key);\n    delete careState.adoptedAt[fake.id];\n    const overdueBefore = careOverdueTaskDefs(fake).map(t => t.key);"
          )
          replace_once(
              'tests/e2e.mjs',
              "      overdueBefore, overdueAfter, currentFresh",
              "      newlyAdoptedOverdue, overdueBefore, overdueAfter, currentFresh"
          )
          replace_once(
              'tests/e2e.mjs',
              "  check('soins : tâche précédente signalée puis retirée après validation',",
              "  check('soins : une plante adoptée ce mois-ci n’a aucun faux retard',\n    careMonths.newlyAdoptedOverdue.length === 0, careMonths.newlyAdoptedOverdue);\n  check('soins : tâche précédente signalée puis retirée après validation',"
          )

          replace_once('sw.js', "const VERSION = 'hdv-v5';", "const VERSION = 'hdv-v6';")

          workflow = Path('.github/workflows/agent-fix-newly-adopted-care.yml')
          workflow.unlink()
          PY
      - name: Validate syntax and test suite
        run: |
          node --check js/app.js
          node --check tests/e2e.mjs
          node --check sw.js
          npm ci
          npm test
          npm run build:seo
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js tests/e2e.mjs sw.js .github/workflows/agent-fix-newly-adopted-care.yml
          git commit -m "Fix overdue care for newly adopted plants"
          git push origin HEAD:fix/newly-adopted-care-overdue
